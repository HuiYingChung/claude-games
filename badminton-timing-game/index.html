<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badminton Timing Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1>Badminton Timing Game</h1>

    <div class="info">
      <p>Score: <span id="score">0</span></p>
      <p>Round: <span id="round">0</span> / 10</p>
    </div>

    <div class="bar-wrapper">
      <div id="timingBar" class="timing-bar">
        <div class="zone good left-good"></div>
        <div class="zone perfect"></div>
        <div class="zone good right-good"></div>
        <div id="marker" class="marker"></div>
      </div>
    </div>

    <p id="message">Press Start to begin</p>

    <div class="buttons">
      <button id="startBtn">Start</button>
      <button id="hitBtn">Hit</button>
      <button id="restartBtn">Restart</button>
    </div>

    <p class="hint">You can also press the Space bar to hit.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
